<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="1200" height="780" style="background:#0b1120; font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif;">
  <rect width="1200" height="780" fill="#0b1120"/>
  <rect x="0" y="0" width="1200" height="64" fill="#0f172a"/>
  <circle cx="36" cy="32" r="14" fill="#38bdf8"/>
  <text x="36" y="37" fill="#0b1120" font-size="10" font-weight="900" text-anchor="middle">717</text>
  <text x="64" y="38" fill="#f8fafc" font-size="20" font-weight="800">ARINC717Forge <tspan fill="#38bdf8">Pro</tspan></text>
  <rect x="250" y="22" width="70" height="20" rx="4" fill="#1e293b"/>
  <text x="285" y="36" fill="#94a3b8" font-size="11" font-weight="600" text-anchor="middle">v1.0.0</text>
  <rect x="850" y="20" width="310" height="26" rx="13" fill="#064e3b" stroke="#059669" stroke-width="1"/>
  <text x="1005" y="38" fill="#ecfdf5" font-size="12" font-weight="700" text-anchor="middle">ARINC SPECIFICATION 717 FDR CERTIFIED</text>
  <g transform="translate(40, 90)">
    <rect width="360" height="640" rx="12" fill="#0f172a" stroke="#1e293b"/>
    <text x="24" y="36" fill="#e2e8f0" font-size="16" font-weight="700">Flight Data Recorder Config</text>
    <rect x="20" y="70" width="320" height="50" rx="6" fill="#1e293b"/>
    <text x="36" y="100" fill="#38bdf8" font-size="13" font-family="monospace">Word Rate: 256 Words/s (3072 bps)</text>
    <rect x="20" y="140" width="320" height="90" rx="6" fill="#1e293b"/>
    <text x="36" y="165" fill="#f1f5f9" font-size="12">Altitude: 35,000 ft | CAS: 280 kts</text>
    <text x="36" y="188" fill="#34d399" font-size="12">Pitch: +2.5&deg; | Roll: 0.0&deg; | Normal: 1.0g</text>
    <text x="36" y="211" fill="#64748b" font-size="12">Barker Sync: 0x247 (Subframe 1 of 4)</text>
    <rect x="20" y="250" width="320" height="40" rx="6" fill="#0284c7"/>
    <text x="180" y="275" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">Stream Next Subframe</text>
  </g>
  <g transform="translate(430, 90)">
    <rect width="230" height="110" rx="12" fill="#0f172a" stroke="#1e293b"/>
    <text x="20" y="32" fill="#94a3b8" font-size="12" font-weight="600">BARKER CODE</text>
    <text x="20" y="70" fill="#38bdf8" font-size="28" font-weight="800">0x247</text>
    <rect x="250" y="0" width="230" height="110" rx="12" fill="#0f172a" stroke="#1e293b"/>
    <text x="270" y="32" fill="#94a3b8" font-size="12" font-weight="600">BIT RATE CLOCK</text>
    <text x="270" y="70" fill="#34d399" font-size="28" font-weight="800">3072 <tspan font-size="16" fill="#64748b">bps</tspan></text>
    <rect x="495" y="0" width="235" height="110" rx="12" fill="#0f172a" stroke="#1e293b"/>
    <text x="515" y="32" fill="#94a3b8" font-size="12" font-weight="600">SUPERFRAME CYCLE</text>
    <text x="515" y="70" fill="#facc15" font-size="28" font-weight="800">4.0 <tspan font-size="16" fill="#64748b">s</tspan></text>
    <g transform="translate(0, 130)">
      <rect width="730" height="510" rx="12" fill="#0f172a" stroke="#1e293b"/>
      <text x="24" y="36" fill="#e2e8f0" font-size="16" font-weight="700">10-Point Normative ARINC 717 Compliance Scorecard</text>
      <text x="600" y="36" fill="#34d399" font-size="13" font-weight="700">10/10 PASS (100%)</text>
      <line x1="24" y1="54" x2="706" y2="54" stroke="#1e293b"/>
      <text x="36" y="86" fill="#f1f5f9" font-size="13">&#x2713; Section 3.1: 12-Bit Telemetry Word Alignment &amp; Integer Packing (0–4095)</text>
      <text x="36" y="126" fill="#f1f5f9" font-size="13">&#x2713; Section 3.2: Subframe 1 Barker Synchronization Code Conformance (0x247)</text>
      <text x="36" y="166" fill="#f1f5f9" font-size="13">&#x2713; Section 3.2: Subframe 2 Inverted Barker Synchronization Conformance (0x5B8)</text>
      <text x="36" y="206" fill="#f1f5f9" font-size="13">&#x2713; Section 3.2: Subframe 3 &amp; 4 Alternating Barker Pairs (0xA47 &amp; 0xDB8)</text>
      <text x="36" y="246" fill="#f1f5f9" font-size="13">&#x2713; Section 2.2: 4-Subframe Superframe Slicing Cycle (4.0s Total Duration)</text>
      <text x="36" y="286" fill="#f1f5f9" font-size="13">&#x2713; Section 3.3: Standard Word Rate Configurations (64, 128, 256, 512, 1024 wps)</text>
      <text x="36" y="326" fill="#f1f5f9" font-size="13">&#x2713; FAA Part 121: Mandatory Flight Parameters (Alt, Speed, Heading, g-forces)</text>
      <text x="36" y="366" fill="#f1f5f9" font-size="13">&#x2713; Section 5.1: Harvard Biphase &amp; BPRZ Self-Clocking Physical Modulation</text>
      <text x="36" y="406" fill="#f1f5f9" font-size="13">&#x2713; Section 4.2: Word 2 Superframe Cyclic Sub-Multiplexing Counter (0–15)</text>
      <text x="36" y="446" fill="#f1f5f9" font-size="13">&#x2713; Avionics Ecosystem: Crash-Protected SSDFR / Black Box Interoperability</text>
    </g>
